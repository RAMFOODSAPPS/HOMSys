name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Restore
        working-directory: dotnet
        run: dotnet restore HOMSys.slnx
      - name: Build
        working-directory: dotnet
        run: dotnet build HOMSys.slnx --no-restore --configuration Release

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dotnet/frontend/homsys-web/package-lock.json
      - name: Install
        working-directory: dotnet/frontend/homsys-web
        run: npm ci --legacy-peer-deps
      - name: Build
        working-directory: dotnet/frontend/homsys-web
        run: npm run build -- --configuration=production
      - name: Test
        working-directory: dotnet/frontend/homsys-web
        run: npx ng test --watch=false --browsers=ChromeHeadless
